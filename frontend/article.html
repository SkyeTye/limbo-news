<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research - Limbo News</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="site-name"><span>Limbo</span> News</a>
  </div>
</header>

<main class="container">

  <div class="article-header">
    <a href="/" class="back-link">← All research</a>
    <h1 id="article-topic" class="article-topic"></h1>
    <div class="article-meta">
      <span id="article-date" class="date"></span>
      <span id="article-status" class="badge badge-researching">In Progress</span>
    </div>
  </div>

  <div class="article-layout">

    <aside class="article-sidebar">
      <ul id="sidebar-nav" class="sidebar-nav"></ul>
    </aside>

    <div id="article-body">
      <div class="loading-state">
        <span class="spinner"></span>
        <p>Loading research...</p>
      </div>
    </div>

  </div>

</main>

<script src="/js/theme-switcher.js"></script>
<script src="/js/article.js"></script>
</body>
</html>
